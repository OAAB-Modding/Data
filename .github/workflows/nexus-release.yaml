name: publish-release-archive
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing X.Y.Z tag to package (for example, 2.7.6)
        required: true
        type: string

concurrency:
  group: publish-release-archive-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the X.Y.Z format, for example 2.7.6."
            exit 1
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', steps.release.outputs.tag) || '' }}

      - name: set modified times
        shell: bash
        run: find . -name OAAB_Data.esm -xtype f -exec touch -m -d '@1577854800' -- {} +

      - name: create release archive
        shell: bash
        run: 7z a OAAB_Data.7z . '-xr!*.git*' '-x!## *' '-xr!workflow' '-xr!Developer Tools' '-xr!OAAB_Data-HD'

      - name: create HD texture archive
        shell: bash
        working-directory: OAAB_Data-HD
        run: 7z a ../OAAB_Data-HD.7z .

      - name: create developer tools archive
        shell: bash
        working-directory: Developer Tools
        run: |
          files=('OAAB Developer Tools ReadMe.md' 'OAAB_Cells.ESP')
          for file in "${files[@]}"; do
            if [[ ! -f "$file" || ! -s "$file" ]]; then
              echo "::error::Developer tools file $file is missing or empty."
              exit 1
            fi
          done
          7z a ../OAAB_Data-Developer-Tools.7z "${files[@]}"

      - name: test release archives
        shell: bash
        run: |
          7z t OAAB_Data.7z
          7z t OAAB_Data-HD.7z
          7z t OAAB_Data-Developer-Tools.7z

      - name: upload release archives
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            OAAB_Data.7z
            OAAB_Data-HD.7z
            OAAB_Data-Developer-Tools.7z
